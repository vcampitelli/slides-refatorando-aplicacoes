      <rect x="390" y="190" width="180" height="32" fill="#b3ffcb"/><text x="480" y="212" text-anchor="middle" stroke="none">Response</text>
    </g>
    <g data-name="QueueWorker">
      <rect x="690" y="158" width="180" height="64" fill="#b3ffcb"/><text x="780" y="180" text-anchor="middle" stroke="none" font-weight="bold">QueueWorker</text>
    </g>
    <g class="fragment" data-fragment-index="4" data-name="QueueWorker">
      <rect x="690" y="190" width="180" height="32" fill="#b3ffcb"/><text x="780" y="212" text-anchor="middle" stroke="none">Job</text>
    </g>
    <g class="fragment" data-fragment-index="2" data-name="usecase">
      <ellipse cx="480" cy="370" rx="82" ry="32" fill="#ffb0ac"/><text x="480" y="376" text-anchor="middle" stroke="none">UseCase</text>
    </g>
    <g class="fragment" data-fragment-index="4" data-name="o-linha">
      <path d="M90 440 H270 V480 H90 L100 460 Z" fill="#b7e7ff"/><text x="180" y="467" text-anchor="middle" stroke="none">Linha de Comando</text>
    </g>
    <g class="fragment" data-fragment-index="4" data-name="JSON">
      <path d="M390 440 H570 V480 H390 L400 460 Z" fill="#b7e7ff"/><text x="480" y="467" text-anchor="middle" stroke="none">JSON</text>
    </g>
    <g class="fragment" data-fragment-index="4" data-name="o-fila">
      <path d="M690 440 H870 V480 H690 L700 460 Z" fill="#b7e7ff"/><text x="780" y="467" text-anchor="middle" stroke="none">Fila</text>
    </g>
