	#gravity: 3

	[&lt;input&gt; Linha de Comando] &lt;-- lê [Command|ConsoleOutput]
	[Command] invoca -&gt; [&lt;usecase id=usecase1&gt; UseCase]
	[&lt;usecase id=usecase1&gt; UseCase] retorna --&gt; [Command]
	[Command] --&gt; imprime [&lt;output id=o-linha&gt; Linha de Comando]

	[&lt;input&gt; HTTP] &lt;-- lê [Controller|Response]
	[Controller] invoca -&gt; [&lt;usecase id=usecase2&gt; UseCase]
	[&lt;usecase id=usecase2&gt; UseCase] retorna --&gt; [Controller]
	[Controller] --&gt; renderiza [&lt;output&gt; JSON]

	[&lt;input&gt; Fila] &lt;-- lê [QueueWorker|Job]
	[QueueWorker] invoca -&gt; [&lt;usecase id=usecase3&gt; UseCase]
	[&lt;usecase id=usecase3&gt; UseCase] retorna --&gt; [QueueWorker]
	[QueueWorker]--&gt; posta [&lt;output id=o-fila&gt; Fila]
	</desc>
