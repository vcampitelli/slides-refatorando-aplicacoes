<svg version="1.1" width="835" height="458" viewBox="45 32 835 458" xmlns="http://www.w3.org/2000/svg">
<desc >#direction: down
	#font: Chivo Mono
	#fill: #b3ffcb
	#stroke: #53524e
	#.driver: fill=#b7e7ff
	#.usecase: fill=#ffb0ac visual=ellipse
	#.entity: fill=#ffffca
	#.gateway:
	#.lib: fill=#b7e7ff visual=ellipse dashed
	#.input: visual=sender fill=#b7e7ff
	#.presenter:
	#.output: visual=receiver fill=#b7e7ff
	#gravity: 3

	[&lt;input&gt; Linha de Comando] &lt;-- lê [Command|ConsoleOutput]
	[Command] invoca -&gt; [&lt;usecase id=usecase&gt; UseCase]
	[&lt;usecase id=usecase&gt; UseCase] retorna --&gt; [Command]
	[Command] --&gt; imprime [&lt;output id=o-linha&gt; Linha de Comando]

	[&lt;input&gt; HTTP] &lt;-- lê [Controller|Response]
	[Controller] invoca -&gt; [&lt;usecase id=usecase&gt; UseCase]
	[&lt;usecase id=usecase&gt; UseCase] retorna --&gt; [Controller]
	[Controller] --&gt; renderiza [&lt;output&gt; JSON]

	[&lt;input&gt; Fila] &lt;-- lê [QueueWorker|Job]
	[QueueWorker] invoca -&gt; [&lt;usecase id=usecase&gt; UseCase]
	[&lt;usecase id=usecase&gt; UseCase] retorna --&gt; [QueueWorker]
	[QueueWorker]--&gt; posta [&lt;output id=o-fila&gt; Fila]
	</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#53524e" stroke-width="2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Chivo Mono, Helvetica, Arial, sans-serif" font-size="16" fill="#53524e" stroke="#53524e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
