      <path d="M180 158 L180 84" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="199" y="124" text-anchor="middle" stroke="none">lê</text>
    </g>
    <g class="fragment" data-fragment-index="1">
      <path d="M480 158 L480 84" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="499" y="124" text-anchor="middle" stroke="none">lê</text>
    </g>
    <g class="fragment" data-fragment-index="1">
      <path d="M780 158 L780 84" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="799" y="124" text-anchor="middle" stroke="none">lê</text>
    </g>
    <g class="fragment" data-fragment-index="2">
      <path d="M200 222 C200 290 355 280 414 346" fill="none" marker-end="url(#arrow)"/><text x="280" y="270" text-anchor="middle" stroke="none">invoca</text>
    </g>
    <g class="fragment" data-fragment-index="3">
      <path d="M405 366 C335 318 160 322 160 222" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="260" y="340" text-anchor="middle" stroke="none">retorna</text>
    </g>
    <g class="fragment" data-fragment-index="2">
      <path d="M461 222 L461 339" fill="none" marker-end="url(#arrow)"/><text x="433" y="280" text-anchor="middle" stroke="none">invoca</text>
    </g>
    <g class="fragment" data-fragment-index="3">
      <path d="M499 339 L499 222" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="532" y="310" text-anchor="middle" stroke="none">retorna</text>
