    <g class="fragment" data-fragment-index="4">
      <path d="M90 190 L55 190 L55 460 L100 460" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="100" y="425" text-anchor="middle" stroke="none">imprime</text>
    </g>
    <g class="fragment" data-fragment-index="4">
      <path d="M390 190 L355 190 L355 460 L400 460" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="408" y="425" text-anchor="middle" stroke="none">renderiza</text>
    </g>
