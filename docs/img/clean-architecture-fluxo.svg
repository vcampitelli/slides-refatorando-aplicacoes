    </g>
    <g class="fragment" data-fragment-index="1" data-name="Linha de Comando">
      <path d="M90 42 H260 L270 62 L260 82 H90 Z" fill="#b7e7ff"/><text x="180" y="68" text-anchor="middle" stroke="none">Linha de Comando</text>
